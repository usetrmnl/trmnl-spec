name: ci

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
    inputs:
      firmware_repo:
        description: Firmware repository to build and test
        default: usetrmnl/trmnl-firmware
      firmware_ref:
        description: Branch, tag or SHA of the firmware
        default: main
      sim_repo:
        description: trmnl-sim repository to run the firmware in
        default: usetrmnl/trmnl-sim
      sim_ref:
        description: Branch, tag or SHA of trmnl-sim
        default: main
  # Lets the firmware and trmnl-sim repositories run these tests against their own PRs.
  workflow_call:
    inputs:
      firmware_repo:
        type: string
        default: usetrmnl/trmnl-firmware
      firmware_ref:
        type: string
        default: main
      sim_repo:
        type: string
        default: usetrmnl/trmnl-sim
      sim_ref:
        type: string
        default: main
      spec_repo:
        description: trmnl-spec repository to use when called from another repository
        type: string
        default: usetrmnl/trmnl-spec
      spec_ref:
        description: trmnl-spec ref to use when called from another repository
        type: string
        default: main

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.spec_repo || github.repository }}
          ref: ${{ inputs.spec_ref || github.ref }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      # Style, and the specs load and their metadata is valid for every device (no firmware needed).
      - name: rubocop, dry run
        run: bundle exec rake check

  integration:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.spec_repo || github.repository }}
          ref: ${{ inputs.spec_ref || github.ref }}
          path: trmnl-spec

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.sim_repo || 'usetrmnl/trmnl-sim' }}
          ref: ${{ inputs.sim_ref || 'main' }}
          path: trmnl-sim

      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.firmware_repo || 'usetrmnl/trmnl-firmware' }}
          ref: ${{ inputs.firmware_ref || 'main' }}
          path: trmnl-firmware

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cache/pip
            ~/.platformio
          key: ${{ runner.os }}-pio-${{ hashFiles('trmnl-firmware/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-

      # PlatformIO needs Python; the tests are Ruby (RSpec).
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: trmnl-spec

      - name: Install PlatformIO Core and the ESP32 ROM images
        run: |
          pip install --upgrade platformio==6.1.19
          pio pkg install -g -t platformio/tool-esp-rom-elfs

      # The core devices (the default ENVS).
      - name: Build firmware (trmnl)
        run: pio run -d trmnl-firmware -e trmnl -j 4

      - name: Build firmware (trmnl_4clr)
        run: pio run -d trmnl-firmware -e trmnl_4clr -j 4

      # Also fetches the filesystem image (with the ESP32-C5 modem firmware) via post_build_x.py.
      - name: Build firmware (TRMNL_X)
        run: pio run -d trmnl-firmware -e TRMNL_X -j 4

      - name: Build firmware (trmnl_gen2)
        run: pio run -d trmnl-firmware -e trmnl_gen2 -j 4

      - name: Build firmware (trmnl_gen2_4clr)
        run: pio run -d trmnl-firmware -e trmnl_gen2_4clr -j 4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: trmnl-sim

      - name: Build simulator (headless)
        run: cargo build --release --no-default-features --manifest-path trmnl-sim/Cargo.toml

      - name: Integration tests
        working-directory: trmnl-spec
        env:
          TRMNL_SIM_ARTIFACTS: ${{ github.workspace }}/sim-artifacts
          TRMNL_SIM_COVERAGE: ${{ github.workspace }}/sim-coverage
          # every setup flow in full; the default ENVS (the core devices, built above)
          TRMNL_SPEC_NO_CACHE: "1"
          # the headless build above (rake spec would otherwise build the default one)
          TRMNL_SIM_BIN: ${{ github.workspace }}/trmnl-sim/target/release/trmnl-sim
        run: bundle exec rake spec

      - name: Collect screen diffs
        if: failure()
        run: |
          mkdir -p sim-artifacts
          find trmnl-spec/golden -name '*.actual.png' -exec cp {} sim-artifacts/ \; || true

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: simulator-logs-and-screens
          path: sim-artifacts/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: firmware-coverage
          path: |
            sim-coverage/merged.info
            sim-coverage/html/
          if-no-files-found: ignore
